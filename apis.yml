name: Granulate
description: >-
  Granulate is a real-time continuous optimization company acquired by Intel in 2022 and now
  offered as Intel Tiber App-Level Optimization. Its platform autonomously tunes OS-level and
  runtime behavior (scheduling, memory, networking) for compute, Kubernetes, and big-data
  workloads to cut CPU cost and latency without code changes. Granulate also maintains gProfiler,
  an open-source, low-overhead, system-wide continuous profiler that combines multiple sampling
  profilers (perf, py-spy, async-profiler, rbspy, PHP/.NET/Node.js) into a single flamegraph and
  optionally uploads results to the Granulate Performance Studio. gProfiler ships as an
  Apache-2.0 agent (github.com/intel/gprofiler), a self-hosted backend/UI
  (github.com/intel/gprofiler-performance-studio), a Docker image, and cloud-marketplace images.
  The former granulate.io developer surface now redirects to intel.com.
